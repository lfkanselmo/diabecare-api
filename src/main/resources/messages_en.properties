# Glucose alerts
alert.no-glucose.title=No glucose logged
alert.no-glucose.message=You haven't logged your glucose in the last {0} hours.
alert.hypo.title=⚠ Hypoglycemia detected
alert.hypo.message=Your last reading was {0} mg/dL. Consume fast-acting carbohydrates.
alert.high.title=Elevated glucose
alert.high.message=Your last reading was {0} mg/dL, above your target of {1} mg/dL.
alert.hba1c-high.title=Elevated estimated HbA1c
alert.hba1c-high.message=Your estimated HbA1c is {0}%. Consider consulting your doctor.

# Nutrition alerts
alert.no-meal.title=No meals logged today
alert.no-meal.message=You haven't logged any meals today. Nutritional tracking improves glycemic control.

# Positive streak
alert.positive-streak.title=Excellent glycemic control!
alert.positive-streak.message=Your time in range over the last {0} days is {1}%. Keep it up!

# Clinical patterns
alert.pattern.fasting-high.title=Pattern: high fasting glucose
alert.pattern.fasting-high.message={0} of your last {1} fasting readings exceeded {2} mg/dL. Consider adjusting your basal insulin or consulting your doctor.
alert.pattern.postmeal-high.title=Pattern: frequent post-meal spikes
alert.pattern.postmeal-high.message={0} of your last {1} post-meal readings exceeded {2} mg/dL. Review your portion sizes or adjust your bolus insulin.
alert.pattern.hypo-recurrent.title=Pattern: frequent hypoglycemia
alert.pattern.hypo-recurrent.message=You've had {0} hypoglycemia episodes in the last {1} days. Consult your doctor to review your insulin regimen.
alert.pattern.high-variability.title=Pattern: high glycemic variability
alert.pattern.high-variability.message=Your coefficient of variation is {0,number,#} % (target: <{1,number,#}%). High variability increases the risk of complications.

# Menstrual cycle
alert.cycle.luteal-late.title=⚡ Late luteal phase — Higher insulin resistance
alert.cycle.luteal-early.title=🌙 Luteal phase — Frequent monitoring recommended
alert.cycle.ovulation.title=✨ Ovulation window
alert.cycle.period-3days.title=🩸 Your period arrives in 3 days
