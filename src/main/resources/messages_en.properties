alert.cycle.period-tomorrow.title=🩸 Your period arrives tomorrow
alert.cycle.period-tomorrow.message=Monitor your glucose more frequently today and tomorrow.
alert.cycle.period-today.title=🩸 Your period starts today
alert.cycle.period-today.message=Don't forget to log the start of your new cycle.
alert.cycle.open-too-long.title=🩸 Has your period already ended?
alert.cycle.open-too-long.message=You've had your period open for {0} days. If it already ended, log it for more accurate tracking.

cycle.guidance.menstruation=During menstruation glucose can be unpredictable. Monitor more frequently.
cycle.guidance.follicular=Follicular phase: higher insulin sensitivity. You may need less insulin.
cycle.guidance.ovulation=Ovulation window: the estrogen peak can cause a temporary glucose drop.
cycle.guidance.luteal-early=Early luteal phase: progesterone begins increasing insulin resistance. Monitor closely.
cycle.guidance.luteal-late=Late luteal phase: insulin resistance at its peak. It's normal to need more insulin these days.

