name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # "verify" corre en un solo paso, en orden: compilar -> tests unitarios (Surefire)
      # -> empaquetar -> tests de integracion con Testcontainers (Failsafe, requieren
      # Docker - disponible por defecto en los runners de GitHub Actions).
      - name: Build, tests unitarios y tests de integracion
        run: sh ./mvnw -B verify

      - name: Construir imagen Docker
        run: docker build -t diabecare-api:${{ github.sha }} .

      - name: Publicar reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
