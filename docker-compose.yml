services:
  backend:
    build: .
    ports: ['8080:8080']
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/diabecare
      DB_USERNAME: diabecare_user
      DB_PASSWORD: dev_password
      JWT_SECRET_KEY: dev-secret-key-minimo-32-caracteres-para-hs256
      JWT_ACCESS_EXPIRY_MS: 900000
      JWT_REFRESH_EXPIRY_MS: 604800000
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      BCRYPT_STRENGTH: 12
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: mailto:admin@diabecare.com
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: DiabeCare <onboarding@resend.dev>
      FRONTEND_BASE_URL: http://localhost:4200
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ../diabecare-web
    ports: ['4200:80']
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: diabecare
      POSTGRES_USER: diabecare_user
      POSTGRES_PASSWORD: dev_password
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diabecare_user -d diabecare']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
